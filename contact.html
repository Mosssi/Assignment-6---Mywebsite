<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brianna Fronntend Portfolio</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="script.js" defer></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav_container">
      <div class="logo">Brianna</div>
      <ul class="nav_links">
        <li><a href="#home">Home</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#project">Project</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
  <!-- contact -->
  <section id="contact" class="contact_container">
    <div class="section_header">
      <p class="sub_title">Get in Touch</p>
      <h2>Let's Connect</h2>
    </div>

  <form class="contact_form">
    <div class="form">
      <label for="name">Your name <span class="required">*</span></label>
      <input type="text" id="name" placeholder="What's your name?" required>
    </div>

    <div class="form">
        <label for="email">Your email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="What's your email?" required> 
    </div>
       
    <div class="form">
      <label for="message">Your message</label>
      <textarea id="message" rows="6" placeholder="What do you want to say?"></textarea>
    </div>

    <button type="submit" class="submit_btn">Send Message</button>
  </form>
  </section>




  <footer class="footer">
    <p>&copy;2027 Brianna.Designed & Built by Brianna</p>
  </footer>
  </main>
</body>
</html>
